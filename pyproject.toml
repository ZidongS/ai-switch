[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-switch-cli"
version = "0.3.4"
description = "One-command provider and model switching for Claude Code and Codex, with session-history checks"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "ZidongS"}]
keywords = ["codex", "claude-code", "api", "profile", "cli", "model-switching"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
]

[project.scripts]
ai-switch = "ai_switch:main"

[tool.setuptools]
py-modules = ["ai_switch"]
